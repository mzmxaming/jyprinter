# jyprinter —— Flet macOS 打包配置
#
# 说明：
#   1. 本文件供 `flet build macos` 读取，必须与 flet_app.py 放在同一目录（应用根目录）；
#   2. 只要存在 [project].dependencies，flet 就会忽略应用目录下的 requirements.txt，
#      且不会自动追加 flet 本身，因此这里必须显式写上 flet；
#   3. 图标不通过配置项指定：构建脚本会把 assets/jyprinter.png 复制为
#      assets/icon.png，flet 会据此生成 macOS 所需的全套图标；
#   4. requires-python 只用于推导随包 Python 版本，实际以构建机 flet 支持的
#      最高稳定版本为准（可在构建时用 --python-version 覆盖）。

[project]
name = "jyprinter"
version = "1.7.1"
requires-python = ">=3.11,<3.14"
dependencies = [
    "flet==1.0.4",
    "Flask>=3.0",
    "Pillow>=10.0",
    # 限制 1.x：2.0 会引入 onnxruntime / pymupdf-layout / pymupdf4llm 等重依赖，
    # 在 macOS 上易缺失轮子而安装失败，本项目只用 1.x 的渲染 API
    "PyMuPDF>=1.24,<2",
    "qrcode>=7.4",
]

[tool.flet]
# 显示名称（Finder / 启动台里看到的名称）
product = "网络打印服务"
# 产物文件名（jyprinter.app），避免中文名在命令行与 dmg 制作时转义麻烦
artifact = "jyprinter"
org = "com.cgm"
bundle_id = "com.cgm.jyprinter"
company = "陈光明"
copyright = "Copyright © 2026 陈光明"

[tool.flet.app]
# 入口模块：应用根目录下的 flet_app.py
module = "flet_app"
# 不参与打包的开发期文件（构建脚本已只复制运行所需文件，这里作为二次保险）
exclude = [
    "__pycache__",
    "*.pyc",
    ".venv",
    ".venv38",
    ".venv-linux",
    ".venv-macos",
    "build",
    "dist",
    "data",
    "tools",
    "packaging",
    "requirements*.txt",
    "*.spec",
    "说明文档.md",
]

[tool.flet.macos.info]
# 本机需要对外提供局域网网页服务，声明本地网络用途
NSLocalNetworkUsageDescription = "本程序需要在本机局域网内提供网页打印服务，供同一网络内的手机、电脑访问。"
